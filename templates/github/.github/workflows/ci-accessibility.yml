name: CI (Accessibility)

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then npm ci; else npm install -g pa11y; fi
      - name: Run accessibility checks
        run: |
          if [ -f package.json ] && npm run | grep -q "test:a11y"; then npm run test:a11y
          elif [ -f package.json ] && npm run | grep -q "a11y"; then npm run a11y
          else echo "No accessibility script configured; record a gap"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-results
          path: |
            accessibility-results/**
            pa11y-results/**
