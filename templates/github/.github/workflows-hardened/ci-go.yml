# Hardened template. Replace placeholder SHAs with reviewed lock-file pins before use.
name: CI (Go)

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0000000000000000000000000000000000000000
      - uses: actions/setup-go@0000000000000000000000000000000000000000
        with:
          go-version: '1.22'
          cache: true
      - name: Format
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then echo "$UNFORMATTED"; exit 1; fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...
