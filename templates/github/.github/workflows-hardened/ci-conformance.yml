# Hardened template. Replace placeholder SHAs with reviewed lock-file pins before use.
name: CI (Conformance)

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0000000000000000000000000000000000000000
      - uses: actions/setup-python@0000000000000000000000000000000000000000
        with:
          python-version: '3.12'
      - name: Install validator dependencies
        run: |
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
      - name: Validate bundle or repository contracts
        run: |
          if [ -f scripts/validate-bundle.py ]; then python scripts/validate-bundle.py
          elif [ -f scripts/validate-repository-contracts.py ]; then python scripts/validate-repository-contracts.py
          else echo "No conformance validator found"; exit 1
          fi
