# Hardened template. Replace placeholder SHAs with reviewed lock-file pins before use.
name: CI (Python)

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      QUALITY_MODE: blocking
    steps:
      - uses: actions/checkout@0000000000000000000000000000000000000000
      - uses: actions/setup-python@0000000000000000000000000000000000000000
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then python -m pip install -e ".[dev]" || python -m pip install -e .; fi
          if [ -f requirements-dev.txt ]; then python -m pip install -r requirements-dev.txt; fi
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
      - name: Format
        run: python -m black --check .
      - name: Lint
        run: python -m ruff check .
      - name: Typecheck
        run: |
          if python -m mypy --version >/dev/null 2>&1; then python -m mypy .; else echo "mypy not installed"; fi
      - name: Test
        run: python -m pytest
